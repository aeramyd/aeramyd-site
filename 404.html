<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Æramyd</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('aeramyd-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{--bg:#0B1020;--fg:#F5F6FA;--muted:#9AA0B4;--dot:#1E2438;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  [data-theme="light"]{--bg:#F5F6FA;--fg:#0B1020;--muted:#555C72;--dot:#DADDE6}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
  .grid{background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:480px}
  h1{margin:0;font-size:clamp(36px,7vw,56px);letter-spacing:-.04em;line-height:1.05}
  p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
  a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:#5546FF;color:#fff;text-decoration:none;font-weight:600;font-size:16px}
  a.btn:focus-visible{outline:3px solid #5546FF;outline-offset:3px}
</style>
</head>
<body>
<div class="grid">
  <div class="box">
    <svg viewBox="0 0 120 80" width="120" height="80" aria-hidden="true"><path d="M16 56 C30 20 54 66 70 34 C80 14 98 46 106 36" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/></svg>
    <h1>This page didn't snap.</h1>
    <p>The page you're looking for isn't here. It may have moved or never existed.</p>
    <a class="btn" href="/">Back to Æramyd</a>
  </div>
</div>
</body>
</html>
